<!DOCTYPE html>
<html rang="ko">
    <head>
    <meta charset="utf-8">
    <title>가정용 파인애플</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        .jua-regular {
             font-family: "Jua", sans-serif;
             font-weight: 10;
             font-style: normal;
             font-size:20px;}
    #pine {
        text-indent: 5%;
    }
    .mat {
        color: orange;
        text-indent: 5%;
    }
     #jumun {
        text-align: center;
        
     }
     #re {
        text-align: center;
     }
     #center {
        text-align: center;
     }
     fieldset strong {
        color:red;
     }
     #check {
        background-color: black;
        color: white;
        padding: 5px 0;
        text-indent: 2%;
     }
    </style>
    </head>
    <body>
        <form>
            <fieldset class="jua-regular">
            
            <img src="images/fruit.jpg">
            <h1 id="pine">가정용 파인애플</h1>
            
               <p class="mat"><small>흠집이 있고 약간은 못생겼지만 맛과 영양은 그대로입니다.</p> 
                  <p class="mat">질좋은 파인애플을 저렴하게 즐겨보세요.<small></p>
            
            <fieldset id="check"><b>확인하세요</b>
            </fieldset>
            <fieldset style="padding: 0px ;">
            <fieldset id="jumun"><strong>주문 및 배송</strong>
                <p><span style="color:blue">오후 2시 이전</span> 주문건은 당일 발송합니다. <br>
            2시 이후 주문건은 다음날 발송합니다(주말제외)</p>
        </fieldset>

            <fieldset id="re"><strong>교환 및 환불</strong>
                <p>불만족시 <span style="color:blue">100% 환불</span>해 드립니다<br>
            고객센터로 전화주세요</p>
            </fieldset>
            
            <fieldset id="center"><strong>고객센터</strong><p>0000-0000</p> <p>상담시간 : 오전 9시 ~ 오후 6시(토/일, 공휴일 휴무)</p></fieldset>
            </fieldset>
            </fieldset>
        </form>
    </body>
</html>
