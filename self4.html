<!DOCTYPE html>
<html rang="ko">
    <head>
    <meta charset="utf-8">
    <title>가정용 파인애플</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        .jua-regular {
             font-family: "Jua", sans-serif;
             font-weight: 10;
             font-style: normal;
             font-size:20px;
            border: 1px solid gray;
            
        }
    #pine {
        text-indent: 5%;
        
        
        
    }
    .mat {
        color: orange;
        text-indent: 5%;
        
        
    }
     #jumun {
        text-align: center;
        border-top: 1px 1 solid gray;
        
     }
     #re {
        text-align: center;
        border-top: 1px 1 solid gray;
     }
     #center {
        text-align: center;
        border-top: 1px 1 solid gray;
     }
     div strong {
        color:red;
     }
     #check {
        background-color: black;
        color: white;
        padding: 5px 0;
        text-indent: 2%;
        border: solid gray;
     }
     #apple {background: url('images/fruit2.jpg') no-repeat center;
        background-size: cover;
        padding: 1px;
        height: 250px;
     }
     .line {
        border: 1px solid orange;
     }
     #app {
        background-color: #e6e2e29a;
        left: 20px;
        bottom: 10px;
        


      }
    </style>
    </head>
    <body>
        <form>
            <div class="jua-regular">
                
            <div id="apple">

            <div id="app">
            <h1 id="pine">가정용 파인애플</h1>
            
               <p class="mat"><small>흠집이 있고 약간은 못생겼지만 맛과 영양은 그대로입니다.</p> 
                <p class="mat">질좋은 파인애플을 저렴하게 즐겨보세요.<small></p>
            </div>

            </div>



            <div id="check"><b>확인하세요</b>
            </div>
            <div class="line">
            <div id="jumun"><strong>주문 및 배송</strong>
                <p><span style="color:blue">오후 2시 이전</span> 주문건은 당일 발송합니다.</p>
            <p></p>2시 이후 주문건은 다음날 발송합니다(주말제외) <hr></p>
        </div>

            <div id="re"><strong>교환 및 환불</strong>
                <p>불만족시 <span style="color:blue">100% 환불</span>해 드립니다</p>
           <p> 고객센터로 전화주세요 <hr></p>
            </div>

            <div id="center"><strong>고객센터</strong><p>0000-0000</p> <p><small>상담시간 : 오전 9시 ~ 오후 6시(토/일, 공휴일 휴무) </small></p></div>
        </div>
        </div>
        </form>
    </body>
</html>
