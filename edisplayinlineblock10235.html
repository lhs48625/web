<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>display 속성</title>
        <style>
            div {
                margin: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            #inline img {
                margin: 10px;
            }
            #block img {
                display: block;
                margin: 10px;
                width: 100px;
                height: 100px;
                
            }
        </style>
    </head>
    <body>
        <div id="inline">
            <img src="images/babygirl.jpg" alt="">
            <img src="images/ele.jpg" alt="">
            <img src="images/fruit.jpg" alt="">
        </div>
        <div id="block">
            <img src="images/babygirl.jpg" alt="">
            <img src="images/ele.jpg" alt="">
            <img src="images/fruit.jpg" alt="">
        </div>
    </body>
</html>
