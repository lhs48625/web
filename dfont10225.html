<!DOCTYPE html>
<html rang="ko">
    <head>
        <meta charset="utf-8">
        <title>폰트 크기</title>
        <style>
            h1 {
                font-size: 3em;  /*em은 대문자 M의 크기를 기준으로 글씨 크기 변경 M은 16px*/
            }
            p{
                font-size: 1em;
            }
        </style>
    </head>
    <body>
        <h1>3em의 크기를 가진 제목</h1>
        <p>1em의 크기를 가진 단락</p>
    </body>
</html>
