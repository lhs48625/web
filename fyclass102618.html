<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>link 스타일</title>
        <style>
            .container {
                width: 960px;
                margin: 0 auto;
            }
            ul li {
                margin: 15px;
            }
            li.hot::after {
                content: "NEW!!";
                font-size: x-small;
                padding: 2px 4px;
                margin: 0 10px;
                border-radius: 2px;
                background-color: #f00;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>제품 목록</h1>
            <ul>
                <li class="hot">제품 a</li>
                <li>제품 b</li>
                <li>제품 c</li>
                <li class="hot">제품 d</li>
            </ul>
        </div>
    </body>
</html>
