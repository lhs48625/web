<!DOCTYPE html>
<html lang="">
    <head>
        <meta charset="utf-8">
        <title>속성 선택자</title>
        <style>
            ul {
                list-style: none;
            }
            li {
                display: inline-block;
                margin: 10px;
            }
            li a {
                padding: 5px 20px;
                font-size: 14px;
                color: blue;
                text-decoration: none;
            }
            .flat {
                background: blue;
                color: white;
            }
            [class~="button"] {
                border: 2px solid black;
                box-shadow: gray 5px 5px;
            }
        </style>
    </head>
    <body>
        <ul>
            <li><a href="#">메뉴1</a></li>
            <li><a href="#">메뉴2</a></li>
            <li><a href="#" class="button">메뉴3</a></li>
            <li><a href="#" class="flat button">메뉴4</a></li>
        </ul>
    </body>
</html>
