<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>
        대전은 무엇이 유명한가
    </title>
</head>
<body>
    <h1>
        <mark>"성심당"</mark>이 진짜 유명한가
    </h1>
    <p>
        대전에서 유명한 곳을 찍으라면 <span style="color:red;">성심당</span>뿐이다.</p>
        <p>타 지역에서도 인정할 것이다.</p> 
        <p>하지만 그 뿐일 것이다.</p>
    
</body>
</html>
