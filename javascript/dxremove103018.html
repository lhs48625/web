<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>객체</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
        <script>
            $(function(){
                var copyObj = $(".box1").children().clone();
                $(".box2").remove();

                $(".box3").empty();
                $(".box3").append(copyObj);
            });
        </script>
        <style> 
            .box1.box2.box3 {
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
<div class="box1">
<p>내용1</p>
<p>내용2</p>
</div>
<div class="box2">
<p>내용3</p>
<p>내용4</p>
</div>
<div class="box3">
<p>내용5</p>
<p>내용6</p>
</div>
</body>
</html>
