<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>else if문</title>
        <script>
            var num1 = prompt("첫번째 값 입력", "");
            var num2 = prompt("두번째 값 입력", "");
            
            var result = 0;
            result = parseInt(num1) + parseInt(num2);
            document.write ("더하기계산" + num1 + "+" + num2 + "=" + result);

            var result1 = 0;
            result = parseInt(num1) * parseInt(num2);
            document.write ("곱하기" + num1 + "*" + num2 + "=" + result);
            
        </script>
    </head>
</html>
