<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>함수</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            *{margin: 0;
            padding: 0;}
            #galleryZone {
                text-align: center;
            }
            #galleryZone input [
                type="image" {margin: 0 8px;}
            ]
        </style>
        <script>
            var num = 1;
            function gallery(direct) {
                if(direct) {
                    if(num == 8) return;
                    num++;
                }else{
                    if(num == 1) return;
                    num--;
                }
                var imgTag = document.getElementById("photo");
                imgTag.setAttribute("src", "../images/pic_" + num + ".jpg");
            }
        </script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
<div class="container-fluid">

    <span class="navbar-toggler-icon"></span>
  </button>

    </form>
  </div>
</div>

        <div id="galleryZone">
            <p><img src="../images/pic_1.jpg" id="photo" alt=""></p>
            <p>
                <button onclick="gallery(0)" class="btn btn-primary">이전</button>
                <button onclick="gallery(1)" class="btn btn-secondary">다음</button>
            </p>
