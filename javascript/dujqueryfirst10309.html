<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>탐색</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
        <script>
            $(function(){
                $("#menu li:first")
                .css({"background-color":"#ff0"});
                $("#menu li:last")
                .css({"background-color":"#0ff"});
            })
        </script>
    </head>
   <body>
<h1>탐색 선택자</h1>
<ul id="menu">
<li>내용1</li>
<li>내용2</li>
<li>내용3</li>
<li>내용4</li>
</ul>
</body>
</html
