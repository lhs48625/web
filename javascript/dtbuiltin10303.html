<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>함수</title>
        <script>
            var number = '100';
alert(parseInt(number, 2)); // 4
alert(parseInt(number, 8)); // 64 
alert(parseInt(number, 10)); // 100 
alert(parseInt(number, 16)); // 256
var number = '52.273e5';
alert(parseFloat(number)); // 5227300
var number = "일";
if (isNaN(number) == true) {
alert("숫자가 아닙니다");
} else {
alert("숫자 입니다");
}
        </script>
    </head>
</html>
