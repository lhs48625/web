<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>함수</title>
        <script>
            var count = 0;

            myFnc();

            function myFnc() {
                count++
                document.write("hello"+ count, "<br>");
            }

            myFnc(); //계속 반복//

            var theFnc = function() {
                count++
                document.write("bye" + count, "<br>");
            }
            theFnc();
        
        </script>
    </head>
</html>
