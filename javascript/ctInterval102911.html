<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title> 윈도우 객체</title>
        <script>
            var addNum = 0;
            var subNum = 1000;

            var auto_1 = setInterval(function() {
                addNum++;
                console.log("addNum: " + addNum);
            }, 3000);

            var auto_2 = setInterval(function(){
                subNum--;
                console.log("subNum: " + subNum);
            }, 3000);
            
            document.write("현재 문서의 주소는" + location.href + "입니다.");
            document.write("현재 문서의 호스트 이름은" + location.hostname + "입니다.");
            document.write("현재 문서의 파일 경로명은" + location.pathname + "입니다.");
        </script>
    </head>
    <body>
        <h1>일정 시간 간경으로 값 증감시키기</h1>
        <p>콘솔 패널을 열어 확인하세요</p>
        <button onclick="clearInterval(auto_1)">증가정지</button>
        <button onclick="clearInterval(auto_2)">감소정지</button>
    </body>
</html>
