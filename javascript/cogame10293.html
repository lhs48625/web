<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>수학객체</title>
        <script>
            document.write("<h1>컴퓨터 가위, 바위, 보 맞추기</h1>");
            var game = prompt("가위, 바위, 보 중 선택하세요?", "가위");
            var gameNum;
            switch(game) {
                case "가위": gameNum = 1;
                break;
                case "바위": gameNum = 2;
                break;
                case "보": gameNum = 3;
                break;
                default: alert("잘못 작성하셨습니다.");
                location.reload();
            }
            var com = Math.ceil(Math.random() * 3);
            document.write("<img src=\"../images/rsp" + com + ".jpg\">");

            if(gameNum == com) {
                document.write("<img src=\"../images/비김.jpg\">");
            }


            if( gameNum < com ) {
                if (com = 2){
                     document.write("<img src=\"../images/졋다.jpg\">");
                } else {
                    document.write("<img src=\"../images/이김.jpg\">");
                }
               
            } 
            else if (gameNum == 2) {
                if (com = 1 ){
                    document.write("<img src=\"../images/이김.jpg\">");
                } else {
                    document.write("<img src=\"../images/졋다.jpg\">");

                }
            }
            else if( gameNum == 3) {
                if (com = 3){
                document.write("<img src=\"../images/이김.jpg\">");}
            }
            else {document.write("<img src=\"../images/졋다.jpg\">");}

            
        </script>
    </head>
</html>
