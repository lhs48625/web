<!DOCTYPE html>
<html lang="ko">
    <meta charset="utf-8">
    <title>ID 셀렉터</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <script type="text/javascript">
        function addHtml(){
            $("#article").html('안녕하세요' + '<br>');
        };
    </script>
    <body>
        <div>
            <p id="article"></p>
        </div>
        <input type="button" value="추가하기" onclick="addHtml()">
    </body>
</html>
