<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>박스모델</title>
        <style>
            div {
                width: 300px;
                height: 200px;
                display: inline-block;
                margin: 15px;
                border: 2px solid;
                border-radius: 20px;
            }
            .box1 {
                box-shadow: 15px -15px 20px 0px black;
                background: url('images/lion.jpg') no-repeat;
                background-size: cover;
            }
            .box2 {
                box-shadow: 15px 15px 15px 5px gray;
            }
        </style>

    </head>
    <body>
        <table>
        <div class="box1"><p style="color:white">사자</p></div>
        <div class="box2"></div>
        </table>
    </body>
</html>
