<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>배경 이미지</title>
        <style>
            div {
                width: 500px;
                height: 500px;
                border: 2px double black;
                margin-bottom: 20px;
            }
            .bg1{
                background: url('images/ele.jpg') no-repeat left top;
            }
            .bg2{
                background: url('images/ele.jpg') no-repeat left top;
                background-size: auto;
            }
            .bg3 {
                background: url('images/ele.jpg') no-repeat left top;
                background-size: 200px 150px;
            }
            .bg4 {
                background: url('images/ele.jpg') no-repeat left top;
                background-size: 100% 100%;
            }
            .bg5{
                background: url('images/ele.jpg') no-repeat center;
                background-size: contain;
            }
            .bg6{
                background: url('images/ele.jpg') no-repeat left top;
                background-size: cover;
            }
        </style>
    </head>
    <body>
        <div class="bg1"></div>
        <div class="bg2"></div>
        <div class="bg3"></div>
        <div class="bg4"></div>
        <div class="bg5"></div>
        <div class="bg6">ddd</div>
    </body>
</html>
