<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>혼자만드는 레이아웃</title>
        <style>

            * {
                margin: 0;
                padding: 0;
                
            }
            #con {
                width: 1720px;
                
            }
            .card {
                position: relative;
                width: 1900px;
                height: 186px;
                border: 1px solid black;
                background-color: wheat;
                margin-top: 10px;
                
            }
            .card1 {
                 position: relative;
                width: 1900px;
                height: 186px;
                border: 1px solid black;
                background-color: wheat;
                margin-top: 10px;
            }
            .words {
                position: absolute;
                left: 840px;
                top: 85px;
                text-align: center;
                
            }
            .foo {
                position: absolute;
                width: 1900px;
                
                border: 1px solid black;
                background-color: black;
                color: white;
                text-align: center;
                margin-top: 10px;
                padding: 15px;
            }

            @media screen and (max-width:360px) {
                #con {
                    width: 360px;
                    margin: 0px 180px;
                }
                .card {
                    position: relative;
                    width: 360px;
                    height: 85px;
                    margin-top: 10px;
                    border: 1px solid black;
                    background-color: wheat;
                }
                .card1{
                    position: relative;
                    width: 360px;
                    height: 85px;
                    margin-top: 10px;
                    border: 1px solid black;
                    background-color: wheat;
                }
                .words {
                    position: absolute;
                    left: 35px;
                    top: 25px;
                    text-align: center;
                    
                }
                .foo {
                    
                    margin-left: 180px;
                    width: 360px;
                    height: 25px;
                    margin-top: 10px;
                    border: 1px solid black;
                    background-color: black;
                    color: white;

                }
                
            }
            @media screen and (min-width:720px) and (max-width:1200px) {
                
            }
        </style>
    </head>
    <body>
        <div id="con">
            <div class="card">
                <div class="words">
                    <h2>사이트제목</h2>
                </div>
            </div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card1"></div>
        </div>
        <footer class="foo">푸터</footer>
    </body>
</html>
