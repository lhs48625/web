<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>리스트 스타일 배우가</title>
        <style>
            .sqbullet{
                list-style: square;
                list-style: url('images/tiger2.jpg');
            }
            .nobullet{
                list-style: none;
                list-style-position: inside;
            }
            .roman{
                list-style: upper-roman;
            }
            .alpha{
                list-style: lower-alpha;
                list-style-position: inside;
                
            }
           
        </style>
    </head>
    <body>
        <h1>이지스 퍼블리싱</h1>
        <ul class="sqbullet">
            <li>회사소개</li>
            <li>도서</li>
            <li class="roman">자료실</li>
            <li class="roman">질문답변</li>
            <li class="roman">동영상강의</li>
        </ul>
        <ol class="nobullet">
            <li>회사소개</li>
            <li>도서</li>
            <li class="alpha">자료실</li>
            <li class="alpha">질문답변</li>
            <li class="alpha">동영상강의</li>
        </ol>
    </body>
</html>
