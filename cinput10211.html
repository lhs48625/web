<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>웹 폼</title>
        <style>
            body {
                background-color: #fff;
            }
            form legend {
                font-size: 15px;
                font-weight: 600;
            }
            form label.reg {
                font-size: 14px;
                width: 150px;
                float: left;
            }
            form ul li {
                list-style: nome;
                margin: 15px;
            }
            #member, #stuffs {
                width: 50px;
            }
            input[type="submit"] {
                text-align: center;
                width: 150px;
                color: rgb(13, 22, 22);
            }
        </style>
    </head>
    <body>
        <form>
            <fieldset>
                <legend>등록 정보</legend>
                <ul>
                    <li>
                        <label class="reg" for="member">참여인원<small>(최대 10명)</small></label>
                        <input type="member" id="member" value="1" min="0" max="10" step="1">
                    </li>
                    <li>
                        <label class="reg" for="stuffs">지원물품<small>(1인당 5개)</small></label>
                        <input type="number" id="stuffs" value="1" min="0" max="50" step="5">
                    </li>
                    <li>
                        <label class="reg" for="satis">희망단계<small>(하,중,상)</small></label>
                        <input type="range" id="satis" value="1" min="1" max="3">
                    </li>
                </ul>
            </fieldset>
            <input type="submit" value="넣기">
        </form>
    </body>
</html>
