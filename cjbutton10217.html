<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>웹 폼</title>
        <style>
            .subm {
                display: block;
                background-color: aliceblue;
                border: 1px solid #ccc;
                cursor: pointer;
                padding: 5px 10px 6px 7px;
            }
            .subm img {
                border: 0;
                padding: 0;
                width: 16px;
                height: 16px;
                vertical-align: middle;
            }
            .subm:hover{
                background-color: antiquewhite;
                border: 1px solid darkblue;
                color:azure;
            }
        </style>

    </head>
    <body>
        <form>
            <button type="submit" class="subm">
                <img src="images/submit.jpg" alt=""> 전송하기
            </button>
        </form>
    </body>
</html>
