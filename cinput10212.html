<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>웹 폼</title>
        <style>
            body {
                background-color: #fff;
            }
            form fieldset {
                margin-bottom: 25px;
            }
            form legend {
                font-size: 15px;
                font-weight: 600;
            }
            input[type="radio"] {
                margin-left: 25px;
            }
            input[type="checkbox"] {
                margin-left: 25px;
            }

           
        </style>
    </head>
    <body>
        <form>
            <fieldset>
                <legend>신청과목</legend>
                 <label>이 달에 신청할 과목을 선택하세요<small>(1과목만 가능)</small><input type="radio" name="subject" value="speaking">회화</label>
                 <label><input type="radio" name="subject" value="grammar">문법</label>
                 <label><input type="radio" name="subject" value="writing">작문</label>
            </fieldset>
            <fieldset>
                <legend>메일링</legend>
                <label>메일로 받고 싶은 뉴스 주제를 선택해주세요<small>(복수 선택 가능)</small><input type="checkbox" name="mailing1" value="news">해외 단신</label>
                <label><input type="checkbox" name="mailing2" value="dialog">5분 회화</label>
                <label><input type="checkbox" name="mailing3" value="pops">모닝팝스</label>
            </fieldset>
        </form>
    </body>
</html>
